version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: porur-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: porur_construction
      POSTGRES_USER: porur_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-porur_secure_pass_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porur_admin -d porur_construction"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Metabase Dashboard ───────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: porur-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_appdb
      MB_DB_PORT: 5432
      MB_DB_USER: porur_admin
      MB_DB_PASS: ${POSTGRES_PASSWORD:-porur_secure_pass_2024}
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: Asia/Kolkata
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data

  # ── Metabase App Database (separate from construction data) ──────────────
  # Metabase stores its own config in the same PostgreSQL instance
  # but in a separate database. Create it on first run:
  metabase-setup:
    image: postgres:16-alpine
    container_name: porur-metabase-setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-porur_secure_pass_2024}
    command: >
      sh -c "psql -h postgres -U porur_admin -d porur_construction -c 'SELECT 1' &&
             psql -h postgres -U porur_admin -tc \"SELECT 1 FROM pg_database WHERE datname = 'metabase_appdb'\" | grep -q 1 ||
             psql -h postgres -U porur_admin -c 'CREATE DATABASE metabase_appdb'"
    restart: "no"

volumes:
  postgres_data:
  metabase_data:
